name: Patch Experiment 05 notebook

on:
  push:
    paths:
      - scripts/patch_experiment05.py

permissions:
  contents: write

jobs:
  patch-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replace notebook with corrected revision
        run: python scripts/patch_experiment05.py

      - name: Remove one-time patch files
        run: |
          rm scripts/patch_experiment05.py
          rm .github/workflows/patch-experiment05.yml

      - name: Commit corrected notebook
        run: |
          git config user.name "chatgpt-research-supervisor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/05_dp_sgd_privacy_utility_sweep.ipynb scripts/patch_experiment05.py .github/workflows/patch-experiment05.yml
          git commit -m "fix: match DP shadow epsilon and delta [skip ci]"
          git push
