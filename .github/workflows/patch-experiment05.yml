name: Patch Experiment 05 notebook

# One-time correction workflow for the Experiment 05 DP-shadow protocol.
on:
  push:
    paths:
      - scripts/patch_experiment05.py
      - .github/workflows/patch-experiment05.yml
  pull_request:
    paths:
      - scripts/patch_experiment05.py
      - .github/workflows/patch-experiment05.yml

permissions:
  contents: write

jobs:
  patch-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize patch script formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/patch_experiment05.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "\n\n\ndef shadow_config_path",
              "\n\ndef shadow_config_path",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Replace notebook with corrected revision
        run: python scripts/patch_experiment05.py

      - name: Remove one-time patch files
        run: |
          rm scripts/patch_experiment05.py
          rm .github/workflows/patch-experiment05.yml

      - name: Commit corrected notebook
        run: |
          git config user.name "chatgpt-research-supervisor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: match DP shadow epsilon and delta [skip ci]"
          git push
