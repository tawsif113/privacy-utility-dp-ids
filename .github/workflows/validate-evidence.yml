name: Validate research evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed evidence
        run: python scripts/validate_evidence.py
